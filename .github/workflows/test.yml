name: Test
on:
  push:
    branches: ['sync/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libayatana-appindicator3-dev
      - name: Format and resolve modules
        run: |
          gofmt -w $(git ls-files '*.go')
          go mod tidy
      - name: Unit tests
        run: go test -timeout 120s ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build CLI
        env:
          CGO_ENABLED: '0'
        run: go build -o /tmp/nwafu-connect .
      - name: Save formatting and dependency diff
        if: always()
        run: |
          git diff > /tmp/format-and-modules.patch
          cp "$(go env GOROOT)/bin/gofmt" /tmp/gofmt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: format-and-modules
          path: |
            /tmp/format-and-modules.patch
            /tmp/gofmt
