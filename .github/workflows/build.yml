name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "packaging/**"
      - "scripts/**"
      - "config.toml.example"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "packaging/**"
      - "scripts/**"
      - "config.toml.example"
      - ".github/workflows/*.yml"

permissions:
  contents: read

jobs:
  test:
    name: Format, Vet & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux Fyne test dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libayatana-appindicator3-dev

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  cli:
    name: CLI (${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, 386]
        exclude:
          - goarch: 386
            goos: darwin
        include:
          - { goos: linux, goarch: arm, goarm: 7 }
          - { goos: linux, goarch: arm, goarm: 6 }
          - { goos: linux, goarch: arm, goarm: 5 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux, goarch: mips64 }
          - { goos: linux, goarch: mips64le }
          - { goos: linux, goarch: mipsle }
          - { goos: linux, goarch: mips }
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI and stdio proxy helper
        run: |
          set -euo pipefail
          ASSET_SUFFIX="${GOOS}-${GOARCH}${GOARM:-}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          EXT=""
          if [[ "${GOOS}" == "windows" ]]; then
            EXT=".exe"
          fi
          mkdir -p build_assets dist
          go build -trimpath -ldflags "-s -w -buildid= -X main.nwafuConnectVersion=dev -X main.CommitID=${SHORT_SHA}" \
            -o "build_assets/nwafu-connect${EXT}" .
          go build -trimpath -ldflags "-s -w -buildid=" \
            -o "build_assets/nwafu-connect-proxy${EXT}" ./cmd/nwafu-connect-proxy
          cp config.toml.example build_assets/config.toml.example
          (cd build_assets && zip -9r "../dist/nwafu-connect-${ASSET_SUFFIX}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: ci-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/*.zip
          if-no-files-found: error
